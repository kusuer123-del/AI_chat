server:
  port: 5501
  shutdown: graceful

spring:
  application:
    name: ai-smart-customer-service
  ai:
    dashscope:
      # 只在环境变量里放 Key，不要提交到仓库
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
          temperature: 0.5
          top-p: 0.9
      embedding:
        options:
          model: text-embedding-v3
      image:
        options:
          model: wanx2.1-t2i-turbo
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

ai:
  audit-enabled: true
  system-prompt: |
    你是「云栖优选」商城的在线客服小云。
    要求：
    1. 回答简洁、口语化，一次不超过 5 句话；
    2. 涉及配送、退换货、会员权益时以知识库资料为准，并在句末标注引用编号 [1]；
    3. 资料没覆盖的问题，先说明"需要转人工确认"，再给通用建议，禁止编造政策；
    4. 用户问天气、快递时，可以调用工具后把结果转述成人话。
  memory:
    # memory：进程内，重启失效；file：落本地 JSON；redis：外置，多实例共享
    store: memory
    window: 20
    file-dir: ./data/chat-memory
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""
      database: 0
      key-prefix: "aics:chat:"
      ttl: 2h
      timeout-ms: 2000
  rag:
    top-k: 4
    similarity-threshold: 0.45
    store-file: ./data/vector-store.json
    # 首次启动自动把 classpath:docs/*.md 灌进知识库（需要有效的 API Key）
    auto-load: true
  image:
    model: wanx2.1-t2i-turbo
    size: 1024*1024
  agent:
    # 单轮最大决策步数与工具调用次数：预算耗尽会主动收敛，而不是无限循环
    max-steps: 6
    max-tool-calls: 4
    deadline-ms: 60000
    # 草稿自检：判断回答是否有证据支撑，不通过则强制修正
    critic: true
    trace-dir: ./data/agent-traces
    trace-capacity: 200
    eval-file: classpath:agent/eval-cases.jsonl

logging:
  level:
    root: info
    com.mdkj: debug
    AI_AUDIT: info